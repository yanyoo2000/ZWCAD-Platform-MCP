[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zwcad-mcp"
version = "0.1.4"
description = "MCP server driving ZWCAD platform and ZWCAD Mechanical via COM"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastmcp>=2.10.3,<3",
    "pyzwcad>=0.1",
    "pyzwcadmech>=0.3.0",
    "comtypes>=1.1",
    "pywin32>=305",
]

[project.scripts]
zwcad-mcp = "server:main"

[tool.hatch.build]
include = ["src", "README.md", "LICENSE", "THIRD_PARTY_NOTICES.md"]

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]

[tool.hatch.build.targets.wheel.force-include]
"README.md" = "README.md"
"THIRD_PARTY_NOTICES.md" = "THIRD_PARTY_NOTICES.md"

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "LICENSE", "THIRD_PARTY_NOTICES.md", "pyproject.toml"]
exclude = [".review-src/**", "node_modules/**", "tests/**", ".venv/**", "dist/**", "connector/**"]
